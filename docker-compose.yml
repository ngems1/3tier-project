services:
  db:
    image: mysql:8.0
    container_name: three-tier-db
    restart: unless-stopped
    command: ["--default-authentication-plugin=mysql_native_password"]
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: webappdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./application_code/appdb.sql:/docker-entrypoint-initdb.d/appdb.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./application_code/app_files
    container_name: three-tier-backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: appuser
      DB_PASSWORD: apppassword
      DB_NAME: webappdb
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./application_code/web_files
    container_name: three-tier-frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_ALB_DNS: backend:4000
    depends_on:
      - backend

volumes:
  db_data:
